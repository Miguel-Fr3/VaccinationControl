name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # O Vite 7 exige Node 20.19+ ou 22.12+; a 22 e a LTS ativa.
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend - Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configura o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A chave usa os .csproj porque nao ha lock file: qualquer mudanca de
      # PackageReference invalida o cache e forca um restore limpo.
      - name: Cache dos pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaura as dependencias
        run: dotnet restore

      # -warnaserror: o projeto esta em zero avisos e a pipeline mantem assim.
      # Se um pacote novo introduzir aviso, o build quebra de proposito.
      - name: Compila
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Executa os testes
        run: dotnet test --no-build --configuration Release --verbosity normal

  # Independente do backend: os dois rodam em paralelo, e a falha de um nao
  # esconde o resultado do outro.
  frontend:
    name: Frontend - Build e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # O cache do npm vem do proprio setup-node; a chave sai do package-lock.json,
      # entao qualquer mudanca de dependencia forca uma instalacao limpa.
      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, e nao npm install: instala exatamente o que esta no lock file e
      # falha se ele estiver fora de sincronia com o package.json.
      - name: Instala as dependencias
        run: npm ci

      - name: Verifica o lint
        run: npm run lint

      # O build roda 'tsc -b' antes do vite: e ele quem confere os tipos, porque
      # o esbuild do vite apaga as anotacoes sem valida-las.
      - name: Compila
        run: npm run build

      - name: Executa os testes
        run: npm test
